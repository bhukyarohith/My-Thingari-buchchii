<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Valentine 💖</title>

  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="hearts"></div>

  <div class="card">
    <div class="media">
      <img id="mediaImage" src="images/eyes.jpg" />
      <video id="mediaVideo" muted playsinline></video>
    </div>

    <h1 id="title">Hariluhh, will you be my Valentine? 💖</h1>
    <p id="subtitle"></p>

    <div id="bgmControls" class="bgm">
      <span>Me right now :</span>
      <button onclick="playBgm()">▶ Play</button>
      <button onclick="stopBgm()">⏸ Stop</button>
    </div>

    <div class="buttons">
      <button id="yesBtn">Yes 💕</button>
      <button id="noBtn">No 🙈</button>
    </div>
  </div>

  <audio id="bgm" src="images/no-bgm.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
