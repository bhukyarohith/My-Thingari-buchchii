<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Valentine</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>
  <div class="bg-hearts"></div>

  <div class="card">
    <!-- HERO (EYES AS BACKGROUND) -->
    <div class="hero" id="hero"></div>

    <div class="content">
      <h1 id="title">
        Hariluhh, will you be my Valentine? 💖
      </h1>

      <p id="subtitle"></p>

      <div class="media">
        <video id="video" playsinline></video>
        <img id="image" />
      </div>

      <div class="controls" id="bgmControls">
        <span>Me right now :</span>
        <button onclick="playBGM()">▶ Play</button>
        <button onclick="stopBGM()">⏸ Stop</button>
      </div>

      <div class="buttons">
        <button id="yesBtn" onclick="yesClick()">Yes 💕</button>
        <button id="noBtn" onclick="noClick()">No 🙈</button>
      </div>

      <p class="final-text" id="finalText"></p>
    </div>
  </div>

  <audio id="bgm" src="images/no-bgm.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
