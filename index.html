<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine 💖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="hearts"></div>

<div class="stage">
  <div class="media">
    <video id="video" muted playsinline></video>
    <img id="image">
  </div>

  <!-- BGM Controls -->
  <div id="bgm-controls">
    <span>Me right now :</span>
    <button id="playBgm">▶ Play</button>
    <button id="stopBgm">⏸ Stop</button>
  </div>

  <h1 id="title"></h1>
  <p id="subtitle"></p>

  <div class="buttons">
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>
</div>

<audio id="noBgm" src="assets/no-bgm.mp3"></audio>
<video id="song" src="assets/love-song.mp4"></video>

<script src="script.js"></script>
</body>
</html>
